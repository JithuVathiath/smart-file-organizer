<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Smart File Organizer safety workflow</title>
  <description id="description">Files pass through read-only scan, explainable classification, dry-run plan, explicit approval, verified move and reversible journal.</description>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="31" font-weight="700">Safe automation is a workflow, not a switch</text>
  <text x="60" y="108" fill="#bfdbfe" font-family="Inter,system-ui,sans-serif" font-size="17">Every decision is visible before any file changes.</text>
  <g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
    <g transform="translate(45 155)"><rect width="160" height="135" rx="16" fill="#fff"/><text x="80" y="45" text-anchor="middle" fill="#3457d5" font-size="14" font-weight="700">01 · READ ONLY</text><text x="80" y="77" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Scan</text><text x="80" y="104" text-anchor="middle" fill="#667085" font-size="13">hash + metadata</text></g>
    <g transform="translate(235 155)"><rect width="160" height="135" rx="16" fill="#fff"/><text x="80" y="45" text-anchor="middle" fill="#3457d5" font-size="14" font-weight="700">02 · EXPLAIN</text><text x="80" y="77" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Classify</text><text x="80" y="104" text-anchor="middle" fill="#667085" font-size="13">rule + reason</text></g>
    <g transform="translate(425 155)"><rect width="160" height="135" rx="16" fill="#fff"/><text x="80" y="45" text-anchor="middle" fill="#3457d5" font-size="14" font-weight="700">03 · PREVIEW</text><text x="80" y="77" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Plan</text><text x="80" y="104" text-anchor="middle" fill="#667085" font-size="13">JSON + HTML</text></g>
    <g transform="translate(615 155)"><rect width="160" height="135" rx="16" fill="#fff"/><text x="80" y="45" text-anchor="middle" fill="#b54708" font-size="14" font-weight="700">04 · EXPLICIT</text><text x="80" y="77" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Approve</text><text x="80" y="104" text-anchor="middle" fill="#667085" font-size="13">separate command</text></g>
    <g transform="translate(805 155)"><rect width="160" height="135" rx="16" fill="#fff"/><text x="80" y="45" text-anchor="middle" fill="#067647" font-size="14" font-weight="700">05 · VERIFY</text><text x="80" y="77" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Apply</text><text x="80" y="104" text-anchor="middle" fill="#667085" font-size="13">never overwrite</text></g>
    <g transform="translate(995 155)"><rect width="160" height="135" rx="16" fill="#fff"/><text x="80" y="45" text-anchor="middle" fill="#067647" font-size="14" font-weight="700">06 · REVERSE</text><text x="80" y="77" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Undo</text><text x="80" y="104" text-anchor="middle" fill="#667085" font-size="13">journalled moves</text></g>
  </g>
  <g stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"><path d="M207 222h23"/><path d="M397 222h23"/><path d="M587 222h23"/><path d="M777 222h23"/><path d="M967 222h23"/></g>
  <text x="60" y="344" fill="#dbeafe" font-family="Inter,system-ui,sans-serif" font-size="15">Local only  ·  deterministic rules  ·  SHA-256 integrity  ·  stale-plan rejection  ·  rollback on failure</text>
</svg>

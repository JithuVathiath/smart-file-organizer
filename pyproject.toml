[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.1"
description = "Safe, explainable, and reversible local file organization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jithu Vathiath Biju"}]
keywords = ["automation", "filesystem", "cli", "privacy", "file-organizer"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JithuVathiath/smart-file-organizer"
Documentation = "https://github.com/JithuVathiath/smart-file-organizer#readme"
Issues = "https://github.com/JithuVathiath/smart-file-organizer/issues"
Source = "https://github.com/JithuVathiath/smart-file-organizer"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
sfo = "smart_file_organizer.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["smart_file_organizer"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # Long embedded HTML/CSS lines remain readable as report source.
